<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Project - Stage 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #333;
      color: white;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: none;
      background-color: #555;
      color: white;
      border-radius: 5px;
    }

    nav {
      background-color: #ddd;
      padding: 1rem;
    }

    #timeline {
      padding: 2rem;
      min-height: 300px;
      background-color: #fff;
    }

    #modal {
      display: none;
    }

    main {
      padding: 2rem;
    }

    article {
      margin-bottom: 2rem;
    }

    figure {
      margin: 1rem 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌟 TimelineApp</div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
  </header>

  <nav>
    <!-- Future filter options go here -->
  </nav>

  <main>
    <section id="timeline">
      <!-- Timeline events will be added here -->
    </section>

    <article>
      <h2>Welcome to the Timeline</h2>
      <p>This project visualizes chronological events. More features coming soon!</p>
    </article>

    <figure>
      <!-- Optional: Insert future diagrams/images -->
    </figure>
  </main>

  <div id="modal">
    <!-- Future modals/popups will be inserted here -->
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const currentBg = getComputedStyle(body).backgroundColor;
      if (currentBg === 'rgb(244, 244, 244)') {
        body.style.backgroundColor = '#121212';
        body.style.color = '#fff';
      } else {
        body.style.backgroundColor = '#f4f4f4';
        body.style.color = '#333';
      }
    }
  </script>

</body>
</html>
